<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador dq–abc de Motores Elétricos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid">

        <!-- CONTROLES -->
        <div class="panel">
            <h2>Controles</h2>
            
            <label for="motor">Tipo de motor</label>
            <select id="motor">
                <option value="spm">PMSM - Ímã Superficial</option>
                <option value="ipm">PMSM - Ímã Interno</option>
                <option value="rel">Relutância Síncrona</option>
                <option value="ind">Indução</option>
            </select>

            <label for="torque">Torque (Nm)</label>
            <input type="range" id="torque" min="0" max="20" step="0.1" value="5">

            <label for="speed">Velocidade (rpm)</label>
            <input type="range" id="speed" min="0" max="100" step="2" value="20">

            <p id="dqread"></p>
        </div>

        <!-- OSCILOSCÓPIO ABC -->
        <div class="panel">
            <h2>Osciloscópio - Correntes abc</h2>
            <canvas id="abc"></canvas>
        </div>

        <!-- dq -->
        <div class="panel">
            <h2>Componentes dq</h2>
            <canvas id="dqplot"></canvas>
        </div>

        <!-- ROTOR -->
        <div class="panel">
            <h2>Representação Visual</h2>
            <canvas id="rotor"></canvas>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
