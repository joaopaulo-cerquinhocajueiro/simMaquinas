<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Simulador dq–abc de Motores Elétricos</title>
<style>
body{font-family:Arial;margin:0;background:#f4f4f4}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;height:100vh;gap:10px;padding:10px}
.panel{background:#fff;border-radius:12px;padding:10px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
h2{margin:5px 0;font-size:16px}
label{display:block;font-size:13px;margin-top:5px}
input,select{width:100%}
canvas{width:100%;height:100%}
</style>
</head>
<body>
<div class="grid">

<!-- CONTROLES -->
<div class="panel">
<h2>Controles</h2>
<label>Tipo de motor</label>
<select id="motor">
<option value="spm">PMSM – Ímã Superficial</option>
<option value="ipm">PMSM – Ímã Interno</option>
<option value="rel">Relutância Síncrona</option>
<option value="ind">Indução</option>
</select>

<label>Torque (Nm)</label>
<input type="range" id="torque" min="-20" max="20" step="0.1" value="5">

<label>Velocidade (rpm)</label>
<input type="range" id="speed" min="00" max="300" step="10" value="260">

<p id="dqread"></p>
</div>

<!-- OSCILOSCÓPIO ABC -->
<div class="panel">
<h2>Osciloscópio – Correntes abc</h2>
<canvas id="abc"></canvas>
</div>

<!-- dq -->
<div class="panel">
<h2>Componentes dq</h2>
<canvas id="dqplot"></canvas>
</div>

<!-- ROTOR -->
<div class="panel">
<h2>Rotor (suavizado)</h2>
<canvas id="rotor"></canvas>
</div>

</div>

<script>
const ctxABC = document.getElementById('abc').getContext('2d');
const ctxDQ  = document.getElementById('dqplot').getContext('2d');
const ctxR   = document.getElementById('rotor').getContext('2d');

let t=0;
const buffer = {a:[],b:[],c:[]};
const N = 300;

function calcDQ(motor,T){
 let id=0,iq=0;
 if(motor==='spm'){id=0;iq=T}
 if(motor==='ipm'){iq=T/1.5;id=-0.5*iq}
 if(motor==='rel'){iq=Math.sqrt(Math.abs(T));id=-iq*Math.sign(T)}
 if(motor==='ind'){id=1;iq=T}
 return {id,iq}
}

function drawScope(ctx, signals, colors, labels){
 ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);
 const h = ctx.canvas.height;
 const w = ctx.canvas.width;
 ctx.strokeStyle='#ddd';
 ctx.beginPath(); ctx.moveTo(0,h/2); ctx.lineTo(w,h/2); ctx.stroke();
 signals.forEach((sig,i)=>{
  ctx.strokeStyle=colors[i]; ctx.beginPath();
  sig.forEach((v,k)=>{
   const x = k/N*w;
   const y = h/2 - v*10;
   if(k===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.fillStyle=colors[i]; ctx.fillText(labels[i],5,15+15*i);
 });
}

function animate(){
 t+=0.02;
 const motor=document.getElementById('motor').value;
 const T=parseFloat(document.getElementById('torque').value);
 const rpm=parseFloat(document.getElementById('speed').value);
 console.log(`Motor: ${motor} | Torque: ${T} Nm | Velocidade: ${rpm} rpm`);
 const w=rpm*2*Math.PI/60;
 const {id,iq}=calcDQ(motor,T);
 document.getElementById('dqread').innerHTML=`Id = ${id.toFixed(2)} A | Iq = ${iq.toFixed(2)} A`;

 const ia=id*Math.cos(w*t)-iq*Math.sin(w*t);
 const ib=id*Math.cos(w*t-2*Math.PI/3)-iq*Math.sin(w*t-2*Math.PI/3);
 const ic=id*Math.cos(w*t+2*Math.PI/3)-iq*Math.sin(w*t+2*Math.PI/3);

 buffer.a.push(ia); buffer.b.push(ib); buffer.c.push(ic);
 if(buffer.a.length>N){buffer.a.shift();buffer.b.shift();buffer.c.shift();}

 drawScope(ctxABC,[buffer.a,buffer.b,buffer.c],['red','green','blue'],['ia','ib','ic']);

 // dq vetorial
 ctxDQ.clearRect(0,0,ctxDQ.canvas.width,ctxDQ.canvas.height);
 ctxDQ.translate(ctxDQ.canvas.width/2,ctxDQ.canvas.height/2);
 ctxDQ.strokeStyle='#aaa'; ctxDQ.beginPath(); ctxDQ.moveTo(-100,0); ctxDQ.lineTo(100,0); ctxDQ.moveTo(0,-100); ctxDQ.lineTo(0,100); ctxDQ.stroke();
 ctxDQ.strokeStyle='purple'; ctxDQ.beginPath(); ctxDQ.moveTo(0,0); ctxDQ.lineTo(id*20,0); ctxDQ.stroke(); ctxDQ.fillText('Id',id*20+5,0);
 ctxDQ.strokeStyle='orange'; ctxDQ.beginPath(); ctxDQ.moveTo(0,0); ctxDQ.lineTo(0,-iq*20); ctxDQ.stroke(); ctxDQ.fillText('Iq',0,-iq*20-5);
 ctxDQ.setTransform(1,0,0,1,0,0);

 // rotor suavizado
 ctxR.clearRect(0,0,ctxR.canvas.width,ctxR.canvas.height);
 ctxR.save();
 ctxR.translate(ctxR.canvas.width/2,ctxR.canvas.height/2);
 ctxR.rotate(w*t);
 ctxR.lineWidth=2;
 ctxR.beginPath(); ctxR.arc(0,0,40,0,2*Math.PI); ctxR.stroke();
 ctxR.beginPath(); ctxR.moveTo(-30,0); ctxR.lineTo(30,0); ctxR.stroke();
 ctxR.restore();

 requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
